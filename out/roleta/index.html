<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Roleta da Sorte - Modo Caos Estável</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🎡 Roleta da Sorte</h1>

    <div class="main-container">
        <div class="left-side">
            <div id="seta1" class="seta" style="display: block; transform: rotate(0deg);"></div>
            <div id="seta2" class="seta" style="transform: rotate(120deg);"></div>
            <div id="seta3" class="seta" style="transform: rotate(240deg);"></div>
            <canvas id="canvas" width="560" height="560"></canvas>
        </div>

        <div class="right-side">
            <label style="display:block; margin-bottom:10px;">Participantes:</label>
            <textarea id="namesInput">Ana, Bruno, Carlos, Diana, Eduardo, Fernanda, Gustavo, Helena, Igor, Julia</textarea>
            
            <div id="status" class="status-msg">Pronto para começar!</div>
            <div class="btn-group">
                <button id="btnSingle" class="btn-single" onclick="startSpin('single')">Sorteio Único</button>
                <button id="btnElimination" class="btn-elimination" onclick="startSpin('elimination')">Modo Eliminação</button>
                <button id="btnChaos" class="btn-chaos" onclick="startSpin('chaos')">Modo Caos</button>
            </div>

            <div id="winner-container">
                <p id="winner-text">Aguardando...</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
