<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sorteio Batalha Naval</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #0f172a; color: white; }
        
        .main-container { display: flex; height: 100vh; width: 100vw; }
        
        /* 3/4 da tela para o jogo */
        .game-area { width: 75%; height: 100%; background: #1e293b; display: flex; justify-content: center; align-items: center; overflow: auto; position: relative; }
        
        /* 1/4 da tela para controles */
        .sidebar { width: 25%; height: 100%; background: #0f172a; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; border-left: 2px solid #334155; box-shadow: -5px 0 15px rgba(0,0,0,0.5); }
        
        .board-grid { display: grid; gap: 4px; padding: 20px; background: #1e293b; border-radius: 8px; }
        
        .cell { 
            width: 45px; height: 45px; 
            background-color: #3b82f6; /* Água não revelada */
            border-radius: 4px; 
            cursor: pointer; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            font-size: 10px; 
            text-align: center; 
            transition: all 0.2s;
            position: relative;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.2);
        }
        .cell:hover { background-color: #60a5fa; transform: scale(1.05); z-index: 10; }
        .cell.revealed { cursor: default; transform: none; }
        
        /* Água revelada */
        .cell.water { background-color: #1e3a8a; opacity: 0.4; box-shadow: none; } 
        
        /* Navio atingido */
        .cell.hit { background-color: #ef4444; color: white; font-weight: bold; border: 2px solid #fca5a5; z-index: 5; text-shadow: 1px 1px 2px black; }
        
        /* Estilização do Navio Militar (Casco) */
        .cell.ship-hull { 
            background-color: #475569; 
            border: none; 
            position: relative;
            overflow: hidden;
        }
        
        /* Formatos do Navio (Proa e Popa) */
        /* Horizontal: Proa (Esquerda) -> Popa (Direita) */
        .ship-h-prow { 
            border-radius: 100% 0 0 100%; /* Bico fino */
            background: linear-gradient(to right, #334155, #475569);
            box-shadow: inset -2px 0 5px rgba(0,0,0,0.3);
        }
        .ship-h-prow::before { /* Canhão */
            content: ''; position: absolute; width: 14px; height: 14px; background: #94a3b8; border-radius: 50%;
            top: 50%; right: 5px; transform: translateY(-50%); border: 2px solid #1e293b; z-index: 1;
        }
        .ship-h-stern { 
            border-radius: 0 4px 4px 0; /* Traseira reta */
            background: linear-gradient(to left, #334155, #475569);
            border-left: 1px dashed #64748b;
        }
        .ship-h-stern::before { /* Ponte de comando */
            content: ''; position: absolute; width: 18px; height: 28px; background: #1e293b;
            top: 50%; left: 4px; transform: translateY(-50%); border-radius: 2px; z-index: 1;
            border: 1px solid #64748b;
        }

        /* Vertical: Proa (Cima) -> Popa (Baixo) */
        .ship-v-prow { 
            border-radius: 100% 100% 0 0; 
            background: linear-gradient(to bottom, #334155, #475569);
            box-shadow: inset 0 -2px 5px rgba(0,0,0,0.3);
        }
        .ship-v-prow::before { /* Canhão */
            content: ''; position: absolute; width: 14px; height: 14px; background: #94a3b8; border-radius: 50%;
            left: 50%; bottom: 5px; transform: translateX(-50%); border: 2px solid #1e293b; z-index: 1;
        }
        .ship-v-stern { 
            border-radius: 0 0 4px 4px; 
            background: linear-gradient(to top, #334155, #475569);
            border-top: 1px dashed #64748b;
        }
        .ship-v-stern::before { /* Ponte de comando */
            content: ''; position: absolute; width: 28px; height: 18px; background: #1e293b;
            left: 50%; top: 4px; transform: translateX(-50%); border-radius: 2px; z-index: 1;
            border: 1px solid #64748b;
        }
        
        /* Meio do Navio (Para Destroyers - 3 peças) */
        .ship-h-mid { 
            background: linear-gradient(to right, #475569, #334155, #475569);
            border-left: 1px dashed #64748b;
            border-right: 1px dashed #64748b;
            z-index: 1;
        }
        .ship-h-mid::before { /* Detalhe (Chaminé/Ventilação) */
            content: ''; position: absolute; width: 20px; height: 20px; background: #1e293b;
            top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 2px;
            border: 1px solid #64748b;
        }

        .ship-v-mid { 
            background: linear-gradient(to bottom, #475569, #334155, #475569);
            border-top: 1px dashed #64748b;
            border-bottom: 1px dashed #64748b;
            z-index: 1;
        }
        .ship-v-mid::before { /* Detalhe */
            content: ''; position: absolute; width: 20px; height: 20px; background: #1e293b;
            top: 50%; left: 50%; transform: translate(-50%, -50%); border-radius: 2px;
            border: 1px solid #64748b;
        }

        textarea { width: 100%; height: 120px; background: #334155; color: white; border: 1px solid #475569; padding: 10px; border-radius: 6px; margin-bottom: 10px; resize: none; font-family: monospace; }
        textarea:focus { outline: none; border-color: #38bdf8; }
        
        button { width: 100%; padding: 12px; background: #0ea5e9; color: white; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; margin-bottom: 20px; transition: background 0.2s; text-transform: uppercase; letter-spacing: 1px; }
        button:hover { background: #0284c7; }
        
        .participants-list { flex: 1; overflow-y: auto; padding-right: 5px; }
        .participant-item { padding: 8px; border-bottom: 1px solid #334155; font-size: 14px; display: flex; align-items: center; }
        .participant-item i { margin-right: 8px; color: #38bdf8; }
        .participant-item.eliminated { text-decoration: line-through; color: #ef4444; opacity: 0.6; }
        
        h1 { font-size: 1.5rem; margin: 0 0 1.5rem 0; text-align: center; color: #38bdf8; text-transform: uppercase; letter-spacing: 2px; border-bottom: 2px solid #334155; padding-bottom: 15px; }
        label { display: block; margin-bottom: 8px; font-size: 0.9rem; color: #94a3b8; font-weight: 600; }
        
        /* Scrollbar customizada */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
    </style>
</head>
<body>

    <div class="main-container">
        <div class="game-area">
            <div id="board" class="board-grid"></div>
        </div>
        <div class="sidebar">
            <h1>⚓ Batalha Naval</h1>
            
            <label>INSIRA OS NOMES (separados por vírgula):</label>
            <textarea id="namesInput" placeholder="João, Maria, Pedro, Ana..."></textarea>
            <button onclick="setupGame()">PREPARAR FROTAS</button>
            
            <label>TRIPULAÇÃO EM COMBATE:</label>
            <div id="participantsList" class="participants-list"></div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
