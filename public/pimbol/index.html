<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torneio de Pimbol</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="game-container">
        <!-- Barra Lateral: Jogadores e Placar -->
        <div class="sidebar">
            <h2>Jogadores</h2>
            <div class="input-group">
                <input type="text" id="playerName" placeholder="Nomes separados por vírgula" />
                <button id="addPlayerBtn">Adicionar</button>
            </div>
            <div id="statusMessage" class="status-message">Adicione jogadores para começar</div>
            <ul id="playerList" class="player-list"></ul>
        </div>

        <!-- Área do Jogo -->
        <div class="main-area">
            <div id="canvas-container"></div>
        </div>

        <!-- Barra Lateral Direita: Grupo Atual -->
        <div class="sidebar right-sidebar">
            <div class="controls">
                <button id="actionBtn" class="btn-primary">Iniciar Jogo</button>
                <div id="roundInfo">Rodada: 1</div>
            </div>
            <hr class="separator">
            <h2>Jogando Agora</h2>
            <ul id="currentGroupList" class="player-list"></ul>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
