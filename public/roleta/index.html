<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Roleta de Nomes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>Roleta da Sorte</h1>

    <div class="controls">
        <p>Insira os nomes (um por linha):</p>
        <textarea id="namesList">Ana
Bruno
Carlos
Diana
Eduardo</textarea>
        <br>
        <button onclick="spin()">GIRAR ROLETA!</button>
    </div>

    <div class="canvas-container">
        <div id="pointer"></div>
        <canvas id="canvas" width="400" height="400"></canvas>
    </div>

    <div id="winner"></div>

    <script src="script.js"></script>
</body>
</html>
