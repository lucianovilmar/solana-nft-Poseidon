<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Roleta da Sorte Pro</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <h1>🎡 Roleta da Sorte</h1>

    <div class="main-container">
        <div class="left-side">
            <div id="pointer"></div>
            <canvas id="canvas" width="560" height="560"></canvas>
        </div>

        <div class="right-side">
            <label style="display:block; margin-bottom:10px;">Nomes (separados por vírgula):</label>
            <textarea id="namesInput">Ana, Bruno, Carlos, Diana, Eduardo, Fernanda, Gustavo, Helena</textarea>
            
            <div id="status" class="status-msg">Escolha um modo de jogo:</div>
            <div class="btn-group">
                <button id="btnSingle" class="btn-single" onclick="startSpin('single')">Sorteio Único</button>
                <button id="btnElimination" class="btn-elimination" onclick="startSpin('elimination')">Modo Eliminação</button>
            </div>

            <div id="winner-container">
                <p id="winner-text">Quem vencerá?</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
