<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Analista de Poder de Poseidon - Sistema de Boost</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="panel">
        <h2>🔱 Poseidon: Poder com Badge e Boost</h2>
        
        <div class="stats-grid">
            <div class="stat-box">
                <small>Poder Especial Retirado:</small><br>
                <span id="rawPower" style="color: #ffd700; font-weight: bold; font-size: 1.3em;">0</span>
            </div>
            <div class="stat-box">
                <small>Poder Geral (Soma de Poder com Badge):</small><br>
                <span id="generalPower" style="color: #64ffda; font-weight: bold; font-size: 1.3em;">0</span>
            </div>
        </div>

        <div class="controls">
            <div class="control-group">
                <label>Estratégia de Divisão:</label>
                <select id="calcMethod" onchange="processData()">
                    <option value="1">1 - Igualitária</option>
                    <option value="2">2 - Número de Queimados (+921)</option>
                    <option value="3">3 - Aplicar com TRD (+921 + TRD/10k)</option>
                </select>
            </div>
            <div class="control-group">
                <label>🔍 Buscar por Mint:</label>
                <input type="text" id="searchInput" placeholder="Busca nftMint..." oninput="processData()">
            </div>
            <div class="control-group">
                <input type="file" id="fileInput" accept=".txt,.json">
            </div>
        </div>
    </div>

    <table id="resultTable">
        <thead>
            <tr>
                <th>#</th>
                <th>nftMint</th>
                <th>Power Original</th>
                <th>Poder com Badge</th>
                <th>Poseidon Burned</th>
                <th>Power a Receber</th>
                <th>Total Final</th>
                <th>% do Poder</th>
            </tr>
        </thead>
        <tbody id="tableBody"></tbody>
    </table>

    <script src="script.js"></script>
</body>
</html>
