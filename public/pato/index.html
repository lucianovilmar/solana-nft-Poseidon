<!DOCTYPE html>
<html lang="pt-PT">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Corrida de Patinhos - Regras Estritas</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="setup-overlay" class="fixed inset-0 flex items-center justify-center p-4">
        <div class="bg-slate-900 p-8 rounded-3xl border-4 border-yellow-500 max-w-xl w-full shadow-2xl">
            <h1 class="text-yellow-500 text-xl mb-6 text-center uppercase">Lista de Corredores</h1>
            <textarea id="namesInput" class="w-full h-40 p-4 text-slate-900 rounded-xl mb-6 font-sans resize-none focus:ring-4 ring-yellow-500 outline-none" placeholder="Pato 1, Pato 2... (separe por vírgula ou linha)"></textarea>
            <button id="btnPrepare" class="w-full bg-yellow-500 hover:bg-yellow-400 text-blue-900 font-bold py-4 rounded-2xl text-lg transition-all active:scale-95 shadow-lg">
                GERAR CORRIDA
            </button>
        </div>
    </div>

    <div id="game-container" class="game-world hidden">
        <div class="timer-ui" id="timer">00:00</div>

        <div class="pool-viewport" id="viewport">
            <div class="pool-track" id="track">
                <div class="finish-line"></div>
            </div>
        </div>

        <div class="bg-slate-900 p-6 flex justify-center border-t-4 border-yellow-500">
            <button id="btnStart" class="bg-green-500 hover:bg-green-400 text-white px-16 py-4 rounded-full text-xl shadow-xl active:scale-95 transition-all font-bold border-b-4 border-green-700">
                LARGADA!
            </button>
        </div>
    </div>

    <div id="ui-overlay" class="fixed inset-0 hidden flex-col items-center justify-center p-6">
        <div class="bg-slate-900 p-8 rounded-3xl border-4 border-yellow-500 w-full max-w-2xl max-h-[80vh] flex flex-col shadow-2xl">
            <h2 class="text-yellow-500 text-3xl mb-6 text-center">RESULTADOS</h2>
            <div id="podiumList" class="overflow-y-auto mb-6 pr-2 space-y-2"></div>
            <div class="grid grid-cols-2 gap-4">
                <button id="btnRestart" class="bg-blue-600 hover:bg-blue-500 text-white py-4 rounded-xl font-bold transition-all">REPETIR</button>
                <button id="btnNew" class="bg-slate-700 hover:bg-slate-600 text-white py-4 rounded-xl font-bold transition-all">NOVOS NOMES</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
