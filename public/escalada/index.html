<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escalada de Montanha - Sorteio</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="weather-alert">⚠️ NEVASCA NO TOPO! LÍDERES PERDENDO TRAÇÃO!</div>

    <div id="setup-card">
        <h2>🏔️ Escalada de Montanha</h2>
        <textarea id="nameList" placeholder="Nomes dos escaladores..."></textarea><br>
        <button onclick="startClimb()">Iniciar Escalada</button>
    </div>

    <div id="mountain-container">
        <div class="finish-line"></div>
        <div class="nevasca-overlay" id="snowEffect"></div>
    </div>

    <script src="script.js"></script>
</body>
</html>
